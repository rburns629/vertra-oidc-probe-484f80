name: probe
on: push
permissions:
  id-token: write
  contents: read
jobs:
  in-environment:
    runs-on: ubuntu-latest
    environment: catalog-publish
    steps:
      - name: claims
        run: |
          t=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$t" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{sub, ref, environment}' || true
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - name: claims
        run: |
          t=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$t" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{sub, ref, environment}' || true
